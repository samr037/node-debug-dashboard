{{- $data := include "node-debug-dashboard.secretData" . | fromYaml -}}
{{- if $data -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node-debug-dashboard.secretName" . }}
  labels:
    {{- include "node-debug-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end -}}
