{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "node-debug-dashboard.fullname" . }}
  labels:
    {{- include "node-debug-dashboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "node-debug-dashboard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- with .Values.networkPolicy.allowedCIDRs }}
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.httpPort }}
        {{- if $.Values.ssh.enabled }}
        - protocol: TCP
          port: {{ $.Values.ssh.port }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.allowedNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.httpPort }}
    {{- end }}
{{- end }}
