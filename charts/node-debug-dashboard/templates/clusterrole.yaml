{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "node-debug-dashboard.clusterName" . }}
  labels:
    {{- include "node-debug-dashboard.labels" . | nindent 4 }}
rules:
  # Only what the app and the kdiag-* scripts actually read. Deliberately no
  # nodes/proxy: the kubelet authorizes WebSocket exec/attach as a GET on it,
  # so that "read-only" grant would let this token exec into any pod.
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - events
    verbs: ["get", "list", "watch"]
  # kdiag-services probes metrics-server; without this it always gets a 403
  # and reports metrics-server as not available.
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
{{- end -}}
