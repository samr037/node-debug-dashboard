{{- $secretData := include "node-debug-dashboard.secretData" . | fromYaml }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "node-debug-dashboard.fullname" . }}
  labels:
    {{- include "node-debug-dashboard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "node-debug-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "node-debug-dashboard.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations $secretData }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $secretData }}
        # Env from a Secret does not restart pods on change; this does.
        checksum/credentials: {{ toYaml $secretData | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "node-debug-dashboard.serviceAccountName" . }}
      hostNetwork: {{ .Values.hostNetwork }}
      hostPID: {{ .Values.hostPID }}
      hostIPC: {{ .Values.hostIPC }}
      # With hostNetwork the pod inherits the node's resolv.conf, which
      # cannot resolve kubernetes.default.svc. Without this the entire
      # Kubernetes section and the Talos machine details come back empty.
      dnsPolicy: {{ .Values.dnsPolicy | default (ternary "ClusterFirstWithHostNet" "ClusterFirst" .Values.hostNetwork) }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "node-debug-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: {{ .Values.privileged }}
          ports:
            # Without hostNetwork the pod only listens on its pod IP; hostPort
            # keeps it reachable on the node address that NOTES points to.
            - name: http
              containerPort: {{ .Values.httpPort }}
              {{- if not .Values.hostNetwork }}
              hostPort: {{ .Values.httpPort }}
              {{- end }}
              protocol: TCP
            {{- if .Values.ssh.enabled }}
            - name: ssh
              containerPort: {{ .Values.ssh.port }}
              {{- if not .Values.hostNetwork }}
              hostPort: {{ .Values.ssh.port }}
              {{- end }}
              protocol: TCP
            {{- end }}
          env:
            - name: KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HTTP_PORT
              value: {{ .Values.httpPort | quote }}
            - name: SSH_ENABLED
              value: {{ .Values.ssh.enabled | quote }}
            - name: SSH_PORT
              value: {{ .Values.ssh.port | quote }}
            - name: SSH_PASSWORD_AUTH
              value: {{ .Values.ssh.passwordAuth | quote }}
            {{- with .Values.ssh.authorizedKeys }}
            - name: SSH_AUTHORIZED_KEYS
              value: |
                {{- . | nindent 16 }}
            {{- end }}
            {{- if and .Values.ssh.existingSecret .Values.ssh.enabled .Values.ssh.passwordAuth }}
            - name: SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ssh.existingSecret }}
                  key: {{ .Values.ssh.passwordKey }}
            {{- else if hasKey $secretData "ssh-password" }}
            - name: SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "node-debug-dashboard.secretName" . }}
                  key: ssh-password
            {{- end }}
            {{- if .Values.dmesgWindowHours }}
            - name: DMESG_WINDOW_HOURS
              value: {{ .Values.dmesgWindowHours | quote }}
            {{- end }}
            {{- if .Values.counterWindowHours }}
            - name: COUNTER_WINDOW_HOURS
              value: {{ .Values.counterWindowHours | quote }}
            {{- end }}
            {{- if and .Values.ssh.enabled .Values.ssh.persistHostKeys }}
            - name: SSH_HOST_KEY_DIR
              value: {{ .Values.ssh.hostKeyPath | quote }}
            {{- end }}
            {{- /*
              Credentials always come from a Secret: either auth.existingSecret,
              or the chart-managed one built from auth.token / auth.password.
              With existingSecret, token/password act as switches for which keys
              to wire; with neither switch set, both keys are wired (and must
              exist, so a typo fails the pod instead of serving it open).
            */}}
            {{- $token := include "node-debug-dashboard.str" .Values.auth.token }}
            {{- $password := include "node-debug-dashboard.str" .Values.auth.password }}
            {{- $authSource := "" }}
            {{- $tokenKey := "" }}
            {{- $passwordKey := "" }}
            {{- if .Values.auth.existingSecret }}
            {{- $authSource = .Values.auth.existingSecret }}
            {{- $anySwitch := or $token $password }}
            {{- if and .Values.auth.tokenKey (or $token (not $anySwitch)) }}
            {{- $tokenKey = .Values.auth.tokenKey }}
            {{- end }}
            {{- if and .Values.auth.passwordKey (or $password (not $anySwitch)) }}
            {{- $passwordKey = .Values.auth.passwordKey }}
            {{- end }}
            {{- if not (or $tokenKey $passwordKey) }}
            {{- fail "auth.existingSecret is set but neither auth.tokenKey nor auth.passwordKey is wired" }}
            {{- end }}
            {{- else }}
            {{- $authSource = include "node-debug-dashboard.secretName" . }}
            {{- if hasKey $secretData "auth-token" }}{{ $tokenKey = "auth-token" }}{{ end }}
            {{- if hasKey $secretData "auth-password" }}{{ $passwordKey = "auth-password" }}{{ end }}
            {{- end }}
            {{- if or $tokenKey $passwordKey }}
            - name: AUTH_USERNAME
              value: {{ .Values.auth.username | quote }}
            {{- with $tokenKey }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $authSource }}
                  key: {{ . }}
            {{- end }}
            {{- with $passwordKey }}
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSource }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.hostRootMount }}
            - name: host-root
              mountPath: /host
              # Mounts the host makes after the pod starts (CSI / Longhorn
              # volumes) show up under /host too, for lsblk/findmnt.
              mountPropagation: HostToContainer
            {{- end }}
            {{- if and .Values.ssh.enabled .Values.ssh.persistHostKeys }}
            - name: ssh-host-keys
              mountPath: {{ .Values.ssh.hostKeyPath }}
            {{- end }}
            - name: host-proc
              mountPath: /host-proc
              readOnly: true
            {{- if .Values.hostDevMount }}
            - name: host-dev
              mountPath: /dev
            {{- end }}
            {{- if .Values.hostSysMount }}
            - name: host-sys
              mountPath: /sys
            {{- end }}
      volumes:
        {{- if and .Values.ssh.enabled .Values.ssh.persistHostKeys }}
        - name: ssh-host-keys
          hostPath:
            path: {{ .Values.ssh.hostKeyPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.hostRootMount }}
        - name: host-root
          hostPath:
            path: /
            type: Directory
        {{- end }}
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        {{- if .Values.hostDevMount }}
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        {{- end }}
        {{- if .Values.hostSysMount }}
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        {{- end }}
