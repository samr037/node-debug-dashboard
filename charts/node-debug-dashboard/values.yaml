# Default values for node-debug-dashboard.

image:
  repository: ghcr.io/samr037/node-debug-dashboard
  # tag defaults to .Chart.AppVersion if unset
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Host port for the dashboard / REST API (uses hostNetwork).
httpPort: 80

# Dashboard authentication. Combined with hostNetwork, an open dashboard is
# a full read of the node for anything that can route to it. Set one of
# these, and prefer existingSecret over putting a credential in values.
#
#   token     "Authorization: Bearer <token>", for scripts only
#   password  HTTP Basic, so a browser prompts for it (the web UI needs this)
#
# With none of token, password or existingSecret set, `helm install` /
# `helm upgrade` generate a random password (kept across upgrades) into the
# chart-managed Secret; NOTES.txt prints how to read it. `helm template`
# (Argo CD, Flux) cannot do that, as it has no cluster to keep the value in,
# so it renders with auth off: use existingSecret there.
#
# Values set here are stored in a chart-managed Secret, never inline in the
# pod spec. Pass numeric-looking values with --set-string or quoted in YAML.
auth:
  # Explicitly serve the dashboard without authentication (no generated
  # password). Only for a node network nobody else can reach.
  disabled: false
  username: debug
  token: ""
  password: ""
  # Source the values from an existing Secret instead. Alone, it wires both
  # tokenKey and passwordKey, which must then exist in the Secret (a missing
  # key or Secret keeps the pod from starting rather than serving it open).
  # Set token and/or password to any non-empty value to wire only those keys,
  # or blank a key name to skip it.
  existingSecret: ""
  tokenKey: token
  passwordKey: password

# How far back to scan the kernel ring buffer for faults. Empty uses the
# application default of one week.
dmesgWindowHours: ""

# NIC CRC/carrier and EDAC ECC counters only reset on reboot. A counter is
# warning/critical only while it has gone up within this many hours, and
# info after that. Empty uses the application default of 24.
counterWindowHours: ""

# Restrict who can reach the dashboard. Off by default because it needs
# CIDRs only you know, and because a policy with no rules would silently
# black-hole a working install.
#
# Enabling it with both lists empty fails the render instead.
#
# With hostNetwork (the default) this policy has no effect: the pod's address
# is the node's, and CNIs (Flannel, Calico, Cilium without host policies) do
# not enforce NetworkPolicy on host-network pods. Use a host firewall (Talos
# NetworkRuleConfig, Cilium host policies) or an upstream ACL there; rely on
# auth above for the dashboard itself.
networkPolicy:
  enabled: false
  # e.g. ["10.0.0.0/8", "192.168.1.0/24"]
  allowedCIDRs: []
  # e.g. ["monitoring", "observability"]
  allowedNamespaces: []

# SSH debug shell. Off by default. To enable, set ssh.enabled=true and
# pass keys via ssh.authorizedKeys.
ssh:
  enabled: false
  port: 2022
  passwordAuth: false
  # Newline-separated public keys, e.g.:
  #   ssh-ed25519 AAAA... user@host
  #   ssh-rsa AAAA... other@host
  authorizedKeys: ""
  # Required if passwordAuth is true — the image ships both accounts locked,
  # so there is no default password to fall back on. Without one, the
  # entrypoint keeps password auth off. Stored in the chart-managed Secret.
  password: ""
  # Or source it from an existing Secret (used when passwordAuth is true).
  existingSecret: ""
  passwordKey: password
  # Keep each node's SSH host keys in a hostPath, so clients do not hit a
  # "host key changed" warning after every pod restart or upgrade. Off, each
  # pod generates fresh keys on start (safe, but noisy for known_hosts).
  persistHostKeys: true
  hostKeyPath: /var/lib/node-debug-dashboard/ssh

# Required for hardware, Kubernetes, and etcd diagnostics. When false, the
# http (and ssh) ports are published as hostPorts instead.
hostNetwork: true

# Left empty, this follows hostNetwork: ClusterFirstWithHostNet when host
# networking is on, ClusterFirst otherwise. Only set it to override.
dnsPolicy: ""
hostPID: true
hostIPC: true
privileged: true

# Mount host / at /host. Required for SMART, sensors, EFI, Talos bits.
hostRootMount: true

# Mount the host's /dev and /sys explicitly. A privileged container already
# sees both, so this is belt-and-braces rather than strictly required — but
# it makes the dependency visible.
hostDevMount: true
hostSysMount: true

# Read-only access on nodes, pods, services, endpoints, events, plus
# metrics.k8s.io. Used by the Kubernetes section and kdiag-* scripts.
# With create=false, name is required when rbac.create is true.
serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# Run on every node by default.
tolerations:
  - operator: Exists

nodeSelector: {}
affinity: {}

# Observed usage across a 5-node cluster peaked at 350Mi, above the 256Mi
# limit this chart previously defaulted to — so a chart install would be
# OOMKilled on a busy node while the reference DaemonSet was fine. Sized
# from that measurement with headroom for a smartctl sweep across disks.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Probes on /api/health, which stays reachable without credentials when
# auth is on. Set either to {} to drop it.
#
# sshd needs no probe of its own: with ssh.enabled the entrypoint supervises
# it and exits (restarting the container) when sshd dies. A container has a
# single livenessProbe; to watch sshd instead of HTTP, use
#   livenessProbe: {tcpSocket: {port: ssh}, periodSeconds: 30}
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 10
  timeoutSeconds: 3

priorityClassName: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
