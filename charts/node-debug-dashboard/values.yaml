# Default values for node-debug-dashboard.

image:
  repository: ghcr.io/samr037/node-debug-dashboard
  # tag defaults to .Chart.AppVersion if unset
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Host port for the dashboard / REST API (uses hostNetwork).
httpPort: 80

# Dashboard authentication. Unset means no authentication, which combined
# with hostNetwork leaves a full read of the node open to anything that can
# route to it. Set one of these, and prefer existingSecret over putting a
# credential in values.
#
#   token     "Authorization: Bearer <token>", for scripts
#   password  HTTP Basic, so a browser prompts for it
auth:
  username: debug
  token: ""
  password: ""
  # Source the values from an existing Secret instead. When set, token and
  # password above act as switches for which keys to wire up.
  existingSecret: ""
  tokenKey: token
  passwordKey: password

# How far back to scan the kernel ring buffer for faults. Empty uses the
# application default of one week.
dmesgWindowHours: ""

# Restrict who can reach the dashboard. Off by default because it needs
# CIDRs only you know, and because a policy with no rules would silently
# black-hole a working install.
#
# Note this constrains pod-network traffic. With hostNetwork the listener is
# also on the node's own address, where CNI policy does not apply — a host
# firewall or an upstream ACL is what covers that path.
networkPolicy:
  enabled: false
  # e.g. ["10.0.0.0/8", "192.168.1.0/24"]
  allowedCIDRs: []
  # e.g. ["monitoring", "observability"]
  allowedNamespaces: []

# SSH debug shell. Off by default. To enable, set ssh.enabled=true and
# pass keys via ssh.authorizedKeys.
ssh:
  enabled: false
  port: 2022
  passwordAuth: false
  # Newline-separated public keys, e.g.:
  #   ssh-ed25519 AAAA... user@host
  #   ssh-rsa AAAA... other@host
  authorizedKeys: ""

# Required for hardware, Kubernetes, and etcd diagnostics.
hostNetwork: true
hostPID: true
hostIPC: true
privileged: true

# Mount host / at /host. Required for SMART, sensors, EFI, Talos bits.
hostRootMount: true

# Read-only access on nodes, pods, services, endpoints, events.
# Used by the Kubernetes section and kdiag-* scripts.
serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# Run on every node by default.
tolerations:
  - operator: Exists

nodeSelector: {}
affinity: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

priorityClassName: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
