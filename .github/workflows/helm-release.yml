name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  # Re-run once an image release finishes: a chart held back because its
  # appVersion image did not exist yet gets published then.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Two runs (chart push + image release) must not race on gh-pages.
concurrency:
  group: helm-release
  cancel-in-progress: false

env:
  CR_VERSION: "1.6.1"
  CR_SHA256: d4a2ffa825ff1b60a1cce819ce87eec337cf16059ca3d8a053e20cac39cf9e0a

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Install chart-releaser
        run: |
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_amd64.tar.gz"
          echo "${CR_SHA256}  cr.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cr"
          tar -xzf cr.tar.gz -C "$RUNNER_TEMP/cr" cr
          rm -f cr.tar.gz
          echo "$RUNNER_TEMP/cr" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Package every chart instead of letting chart-releaser-action diff
      # against `git describe HEAD~`: that picks up app v* tags too, and a
      # chart bump tagged v* with a later commit pushed on top was never
      # released. Versions that are already out are skipped further down.
      - name: Package charts
        run: |
          rm -rf .cr-release-packages .cr-index
          mkdir -p .cr-release-packages .cr-index
          for chart in charts/*/; do
            [ -f "${chart}Chart.yaml" ] || continue
            helm package "$chart" --destination .cr-release-packages
          done

      # The chart's image tag defaults to appVersion. Hold back a chart whose
      # image is not published yet rather than ship one that sends every
      # node into ImagePullBackOff; the workflow_run trigger retries it once
      # the Release workflow has pushed the image.
      - name: Hold back charts whose image does not exist yet
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            app_version=$(helm show chart "$pkg" | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}')
            image="ghcr.io/${{ github.repository_owner }}/node-debug-dashboard:${app_version}"
            if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "::warning::$(basename "$pkg") held back: image ${image} is not published yet"
              rm -f "$pkg"
            fi
          done

      # Only v* app releases should be GitHub's "Latest" release, so the
      # chart releases are created with --make-release-latest=false.
      - name: Release charts (GitHub releases + gh-pages index)
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          pkgs=(.cr-release-packages/*.tgz)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No chart to release."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          cr upload -o "$owner" -r "$repo" -c "$(git rev-parse HEAD)" \
            --skip-existing --make-release-latest=false
          cr index -o "$owner" -r "$repo" --push

      # GHCR accepts a push over an existing tag and silently replaces it,
      # which would make oci:// and the gh-pages repo serve different
      # content under the same version. Never overwrite a released version.
      - name: Push charts to GHCR (OCI)
        run: |
          shopt -s nullglob
          registry="oci://ghcr.io/${{ github.repository_owner }}/charts"
          for pkg in .cr-release-packages/*.tgz; do
            name=$(helm show chart "$pkg" | awk '/^name:/ {print $2}')
            version=$(helm show chart "$pkg" | awk '/^version:/ {print $2}')
            if helm show chart "${registry}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "${name} ${version} is already in GHCR, skipping"
              continue
            fi
            echo "Pushing $pkg"
            helm push "$pkg" "$registry"
          done
