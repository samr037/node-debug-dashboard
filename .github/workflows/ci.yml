name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this so a v* tag can't publish an image that never
  # passed lint and tests.
  workflow_call:
    inputs:
      skip_build:
        description: Skip the no-push image build (the caller builds it anyway)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff==0.16.1
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet --require-hashes -r requirements-dev.txt
      - run: pytest -q

  # A chart change released under an existing version is skipped by the
  # chart release, so it would silently never ship. Fail the PR instead.
  chart-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a Chart.yaml version bump when a chart changes
        run: |
          base="origin/${{ github.base_ref }}"
          fail=0
          for chart in charts/*/; do
            git diff --quiet "$base"...HEAD -- "$chart" && continue
            old=$(git show "$base:${chart}Chart.yaml" 2>/dev/null | awk '/^version:/ {print $2}')
            new=$(awk '/^version:/ {print $2}' "${chart}Chart.yaml")
            if [ -n "$old" ] && [ "$old" = "$new" ]; then
              echo "::error file=${chart}Chart.yaml::${chart} changed but its version is still ${new}"
              fail=1
            fi
          done
          exit "$fail"

  build:
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
